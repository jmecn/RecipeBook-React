name: CI

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck and build
        run: npm run build

      - name: Verify dist output
        run: |
          test -f dist/index.html
          test -f dist/bundles.json
          test -f dist/language.json
          test -f dist/locales/manifest.json
          test -f dist/locales/en_us.json
          ls -la dist/assets/
